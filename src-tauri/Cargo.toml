[package]
name = "stt-voice-memo-app"
version = "0.1.0"
description = "Mobile-first voice memo application foundation"
authors = ["yoophi"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "stt_voice_memo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-recorder = { path = "plugins/recorder" }
transcription-core = { path = "crates/transcription-core" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
time = { version = "0.3", features = ["parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
