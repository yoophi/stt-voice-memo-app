[package]
name = "tauri-plugin-recorder"
version = "0.1.0"
description = "Tauri mobile plugin for foreground voice recording"
edition = "2024"
rust-version = "1.85"
links = "tauri-plugin-recorder"

[dependencies]
recorder-core = { path = "../../crates/recorder-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.3" }
thiserror = "2"
url = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
